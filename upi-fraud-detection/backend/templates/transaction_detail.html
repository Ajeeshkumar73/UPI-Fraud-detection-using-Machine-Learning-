{% extends 'base.html' %}

{% block title %}Transaction Analysis | UPIGuard{% endblock %}

{% block content %}
<div id="txn-detail-container" class="max-w-5xl mx-auto space-y-6">
    <div class="p-8 text-center text-slate-500">Loading transaction analysis...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadTransactionDetail() {
    const pk = "{{ pk }}";
    const container = document.getElementById('txn-detail-container');
    try {
        const txn = await apiCall(`/transactions/${pk}/`);
        const fd = txn.fraud_detection || {};
        const ra = txn.risk_analysis || {};
        const score = fd.risk_score ?? 0;
        const level = fd.risk_level || 'Low';
        const probPct = Math.round((fd.fraud_probability || 0) * 100);

        let badgeClass = 'risk-badge-low';
        let barColor = 'bg-emerald-600';
        if (level === 'Medium') {
            badgeClass = 'risk-badge-medium';
            barColor = 'bg-amber-600';
        } else if (level === 'High') {
            badgeClass = 'risk-badge-high';
            barColor = 'bg-rose-600';
        }

        container.innerHTML = `
            <div class="space-y-6">
                <!-- Top Header -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4">
                    <div class="flex items-center gap-3">
                        <a href="/transactions/" class="p-2 bg-white hover:bg-slate-100 border border-slate-300 rounded-lg text-slate-600 transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </a>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-xl font-bold text-slate-900 font-mono">${txn.transaction_id}</h1>
                                <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${badgeClass}">${level} Risk</span>
                            </div>
                            <p class="text-slate-500 text-xs mt-0.5">Executed on ${new Date(txn.timestamp).toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div class="text-xs text-slate-500">Policy Outcome</div>
                            <div class="text-base font-bold ${txn.status === 'BLOCKED' ? 'text-rose-600' : (txn.status.includes('OTP') ? 'text-amber-600' : 'text-emerald-600')}">
                                ${txn.status}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Risk Score Overview Cards -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex flex-col justify-between">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Risk Evaluation Score</div>
                        <div class="text-3xl font-extrabold text-slate-900 my-2">${score} <span class="text-xs font-normal text-slate-500">/ 100</span></div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div class="${barColor} h-full rounded-full" style="width: ${Math.min(100, score)}%"></div>
                        </div>
                    </div>

                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex flex-col justify-between">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Model Risk Classification</div>
                        <div class="text-2xl font-extrabold ${fd.prediction_result === 'Fraud' ? 'text-rose-600' : 'text-emerald-600'} my-2">
                            ${fd.prediction_result || 'Genuine'}
                        </div>
                        <div class="text-xs text-slate-500">Fraud Probability: <strong class="text-slate-900">${probPct}%</strong> (${fd.model_name || 'Random Forest'})</div>
                    </div>

                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex flex-col justify-between">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Recommended Action</div>
                        <div class="text-xl font-bold text-slate-900 my-2">${ra.remarks || 'Standard Processing'}</div>
                        <div class="text-xs text-slate-500">Evaluated at ${new Date(fd.detection_time || txn.timestamp).toLocaleTimeString()}</div>
                    </div>
                </div>

                <!-- Detail Columns -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Column 1: Transaction Information -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-200 pb-3">
                            <i data-lucide="receipt" class="w-4 h-4 text-blue-600"></i> Transaction & Beneficiary Info
                        </h3>
                        <dl class="divide-y divide-slate-100 text-sm">
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Amount</dt>
                                <dd class="font-bold text-slate-900">INR ${parseFloat(txn.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Beneficiary Name</dt>
                                <dd class="font-medium text-slate-800">${txn.beneficiary_name}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">UPI ID</dt>
                                <dd class="font-mono text-blue-600 text-xs">${txn.upi_id}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Transaction Type</dt>
                                <dd class="text-slate-800">${txn.transaction_type}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Merchant Category</dt>
                                <dd class="text-slate-800">${txn.merchant_category}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Location</dt>
                                <dd class="text-slate-800">${txn.location}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Device Type</dt>
                                <dd class="text-slate-800">${txn.device_type}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Authentication Method</dt>
                                <dd class="text-slate-800">${txn.authentication_method}</dd>
                            </div>
                        </dl>
                    </div>

                    <!-- Column 2: Behavioral & Risk Indicators -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-200 pb-3">
                            <i data-lucide="activity" class="w-4 h-4 text-blue-600"></i> Behavioral Indicators
                        </h3>
                        <dl class="divide-y divide-slate-100 text-sm">
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Daily Transaction Count</dt>
                                <dd class="font-medium text-slate-800">${txn.daily_transaction_count} txns today</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">7-Day Average Amount</dt>
                                <dd class="font-medium text-slate-800">INR ${parseFloat(txn.avg_transaction_amount_7d).toLocaleString('en-IN')}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Failed Transactions (7d)</dt>
                                <dd class="font-medium ${txn.failed_transaction_count_7d > 0 ? 'text-amber-600' : 'text-slate-800'}">${txn.failed_transaction_count_7d} failed</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Previous Flagged Activity</dt>
                                <dd class="font-semibold ${txn.previous_fraudulent_activity === 1 ? 'text-rose-600' : 'text-emerald-600'}">${txn.previous_fraudulent_activity === 1 ? 'Flagged (1)' : 'Clean (0)'}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Suspicious IP Flag</dt>
                                <dd class="font-semibold ${txn.ip_address_flag === 1 ? 'text-rose-600' : 'text-emerald-600'}">${txn.ip_address_flag === 1 ? 'Proxy / VPN Flagged' : 'Normal IP'}</dd>
                            </div>
                            <div class="py-2 flex justify-between">
                                <dt class="text-slate-500">Transaction Distance</dt>
                                <dd class="font-medium text-slate-800">${txn.transaction_distance} km</dd>
                            </div>
                        </dl>
                    </div>
                </div>

                <!-- Explainable Risk Factors Card -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i> Identified Risk Factors
                    </h3>
                    <ul class="text-xs text-slate-700 space-y-1.5 pl-5 list-disc">
                        ${(ra.risk_factors || []).map(f => `<li class="leading-relaxed">${f}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
        if (window.lucide) window.lucide.createIcons();
    } catch (e) {
        showToast(e.message, 'error');
    }
}
loadTransactionDetail();
</script>
{% endblock %}
